version: "3.9"

services:
  db:
    image: postgres:15
    container_name: protectpyme_db
    restart: always
    environment:
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: admin
      POSTGRES_DB: protectpyme
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  api:
    build: .
    container_name: protectpyme_api
    depends_on:
      - db
    ports:
      - "8000:8000"
    environment:
      DATABASE_URL: postgresql://admin:admin@db:5432/protectpyme
      SECRET_KEY: ultra_secure_key_de_protect_pyme

volumes:
  postgres_data:
